version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: daily
    groups:
      all:
        patterns: ["*"]
    ignore:
      # Ignore next major typescript for now. It failed because there was no es-lint version
      # supporting it yet. We remove this once `7` is better supported by the ecosystem.
      - dependency-name: "typescript"
        versions: ["7.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      all:
        patterns: ["*"]
