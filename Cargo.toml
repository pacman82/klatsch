[package]
name = "klatsch"
version = "0.2.1"
edition = "2024"
license = "MIT"
# Klatsch is a binary and currently not intended to be published at crates.io. Publishing is
# disabled via `publish = false` in release-plz.toml instead — setting it here would make
# release-plz skip the crate entirely, producing no release PR or GitHub release.
# publish = false

[dependencies]
# For opaque runtime errors
anyhow = "1.0.104"
# Password hashing
argon2 = { version = "0.6.0" }
async-sqlite = { version = "0.6.0", features = ["uuid"] }
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
# Axum server listens to incoming connections in a server loop. It replaces `axum::serve` which
# ships with `axum` itself. It can handle TLS termination required for HTTPS.
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
# Session ids are already high-entropy random tokens, so a fast hash suffices to derive their
# storage key — unlike passwords, which need a slow, salted hash. Also used by build.rs.
blake3 = "1.8.7"
dotenvy = "0.15.7"
fs2 = "0.4.3"
futures-util = "0.3.34"
http-body-util = "0.1.5"
# Introduced to have human readable configuration for session expiry in enivornment variables
humantime = "2.4.0"
# Used to implement log formatting. We need our own formatting in order to provide operater-friendly
# sources in the logs. E.g. `server` instead of `axum::serve` and `http` instead of
# `tower_http::trace::on_request`.
nu-ansi-term = "0.50.3"
serde = { version = "1.0.229", features = ["derive"] }
static-serve = "0.6.4"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "rt", "signal", "fs"] }
# `sync` feature is required for `BroadcastStream`.
tokio-stream = { version = "0.1.19", features = ["sync"] }
# Axum builds on top of tower. We use it directly to inject tracing middleware to gain observability
# into http requests.
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Client creates UUIDs for messages. However we generate v4 UUIDs in migrations.
uuid = { version = "1.28.0", features = ["serde", "v4"] }

[dev-dependencies]
double-trait = { version = "0.2.13", features = ["stream"] }
eventsource-stream = "0.2.3"
reqwest = { version = "0.13.5", features = ["cookies", "json", "stream"] }
serde_json = "1.0.152"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["process", "time"] }
tokio-test = "0.4.6"
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.28.0", features = ["serde", "v7"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", features = ["process", "signal"] }

[profile.release]
panic = "abort"
lto = true

[build-dependencies]
# Used to compute an aggregated has of all the sources and build artifacts of the UI, in order to
# detect change and trigger rebuilds.
blake3 = "1.8.7"
# Used to walk all the sources and build artifacts of the UI.
walkdir = "2.5.0"
